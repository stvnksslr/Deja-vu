[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "deja-vu"
version = "0.1.0"
description = "An extremely fast code duplication detector, inspired by Ruff"
authors = [{ name = "Deja-vu Contributors" }]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["linter", "code-quality", "duplication", "clone-detection", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/stvnksslr/Deja-vu"
Repository = "https://github.com/stvnksslr/Deja-vu"
Issues = "https://github.com/stvnksslr/Deja-vu/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "deja_vu"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[package]
name = "deja_python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python language support for Deja-vu"

[dependencies]
deja_ast = { path = "../deja_ast" }
deja_core = { path = "../deja_core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true

# Python parser - RustPython for tokenization
rustpython-parser = "0.3"

# Ruff AST for AST-based detection
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.14.3" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.14.3" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.14.3" }
